<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="智码 CodeQuest — 游戏化编程闯关学习平台，浏览器内真实编译运行，系统掌握 Go / Rust / C++" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>智码 CodeQuest · 编程闯关</title>
    <script>
      // 首屏防闪烁：在样式应用前同步主题（localStorage 优先，其次跟随系统）
      (function () {
        try {
          var t = localStorage.getItem('zhiqu-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <style>
      html { background: #070b14; }
      html[data-theme='light'] { background: #f3f5fb; }
      body { margin: 0; }
      /* 启动加载器：JS 下载期间不白屏（React 挂载后由 main.tsx 移除） */
      #boot-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background: #070b14;
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      html[data-theme='light'] #boot-loader { background: #f3f5fb; }
      #boot-loader .boot-name { font-size: 15px; font-weight: 700; color: #a78bfa; letter-spacing: .02em; }
      html[data-theme='light'] #boot-loader .boot-name { color: #6d28d9; }
      #boot-loader .boot-hint { font-size: 12px; color: #64748b; }
      #boot-loader .boot-spin {
        width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(124, 92, 240, 0.2); border-top-color: #7c5cf0;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#7c5cf0" />
        <text x="32" y="42" text-anchor="middle" font-size="26" font-weight="900" font-family="ui-monospace, monospace" fill="#ffffff">{}</text>
      </svg>
      <div class="boot-name">智码 CodeQuest</div>
      <div class="boot-spin"></div>
      <div class="boot-hint">正在加载关卡数据…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
